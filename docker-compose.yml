# =============================================================================
# Divine Agent System — Docker Compose orchestration
# Compose Spec v2 (no top-level `version:` — that key has been deprecated
# since Compose v2 and is silently ignored / warned by recent CLIs).
# =============================================================================

name: divine-agent-system

x-common-env: &common-env
  DIVINE_AGENT_LOG_LEVEL: ${DIVINE_AGENT_LOG_LEVEL:-INFO}
  DIVINE_AGENT_REDIS_URL: redis://redis:6379/0
  DIVINE_AGENT_POSTGRES_URL: postgresql+psycopg://divine:${POSTGRES_PASSWORD:-divine_password}@postgres:5432/divine_agents
  DIVINE_AGENT_OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  DIVINE_AGENT_PINECONE_API_KEY: ${PINECONE_API_KEY:-}
  DIVINE_AGENT_SUPABASE_URL: ${SUPABASE_URL:-}
  DIVINE_AGENT_SUPABASE_KEY: ${SUPABASE_KEY:-}
  DIVINE_AGENT_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  DIVINE_AGENT_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  # ---------------------------------------------------------------------------
  # Main service — FastAPI orchestrator (production build)
  # ---------------------------------------------------------------------------
  sao:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: sao:2.0.0
    container_name: sao
    restart: unless-stopped
    ports:
      - "8000:8000"   # REST / FastAPI
      - "8001:8001"   # WebSocket
      - "8080:8080"   # JSON-RPC
    environment:
      <<: *common-env
      DIVINE_AGENT_ENVIRONMENT: production
      DIVINE_AGENT_WAIT_FOR: "redis:6379,postgres:5432"
    volumes:
      - sao_data:/app/data
      - sao_logs:/app/logs
      - sao_backups:/app/backups
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      redis:      { condition: service_healthy }
      postgres:   { condition: service_healthy }
      prometheus: { condition: service_started  }
    networks: [divine-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Optional development service (hot reload). Enable with: --profile dev
  # ---------------------------------------------------------------------------
  sao-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: sao:dev
    container_name: sao-dev
    profiles: ["dev"]
    ports:
      - "8010:8000"
      - "8011:8001"
      - "8090:8080"
    environment:
      <<: *common-env
      DIVINE_AGENT_ENVIRONMENT: development
      DIVINE_AGENT_DEBUG: "true"
      DIVINE_AGENT_LOG_LEVEL: DEBUG
    volumes:
      - .:/app
    depends_on:
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [divine-net]

  # ---------------------------------------------------------------------------
  # Quantum variant — same image but the QUANTUM_ENABLED flag is set.
  # Enable with: --profile quantum
  # ---------------------------------------------------------------------------
  sao-quantum:
    build:
      context: .
      dockerfile: Dockerfile
      target: quantum
    image: sao:quantum
    container_name: sao-quantum
    profiles: ["quantum"]
    ports:
      - "8020:8000"
    environment:
      <<: *common-env
      DIVINE_AGENT_ENVIRONMENT: production
      DIVINE_AGENT_QUANTUM_ENABLED: "true"
    depends_on:
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [divine-net]

  # ---------------------------------------------------------------------------
  # Redis Streams — message bus + cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: sao-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    command: >
      redis-server --appendonly yes
                   --maxmemory 512mb
                   --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [divine-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Postgres 16 — Supabase-compatible relational store
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sao-postgres
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: divine_agents
      POSTGRES_USER: divine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-divine_password}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [divine-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divine -d divine_agents"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Prometheus — metrics
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: sao-prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [divine-net]

  # ---------------------------------------------------------------------------
  # Grafana — dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: sao-grafana
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-divine_admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [divine-net]

  # ---------------------------------------------------------------------------
  # Jaeger — OTLP tracing collector + UI
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: sao-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: [divine-net]

networks:
  divine-net:
    driver: bridge

volumes:
  sao_data:        { driver: local }
  sao_logs:        { driver: local }
  sao_backups:     { driver: local }
  redis_data:      { driver: local }
  postgres_data:   { driver: local }
  prometheus_data: { driver: local }
  grafana_data:    { driver: local }
